// the first line of this file is always ignored
// Installed once as /usr/lib/firefox/mozilla.cfg (needs root):
//   sudo install -m644 ~/Projects/yoru/config/firefox/mozilla.cfg /usr/lib/firefox/
// New tabs open the rice's start page; the rest lives in ~/startpages/chrome.js,
// which the rices keep up to date without root.
try {
  const { AboutNewTab } = ChromeUtils.importESModule("resource:///modules/AboutNewTab.sys.mjs");
  AboutNewTab.newTabURL = "file://" + Services.dirsvc.get("Home", Ci.nsIFile).path + "/startpages/current.html";
} catch (e) { Cu.reportError(e); }
// subscripts can't come from file:// URLs, so ~/startpages becomes resource://startpages/
try {
  const dir = Services.dirsvc.get("Home", Ci.nsIFile);
  dir.append("startpages");
  Services.io.getProtocolHandler("resource").QueryInterface(Ci.nsIResProtocolHandler)
    .setSubstitution("startpages", Services.io.newFileURI(dir));
  Services.scriptloader.loadSubScript("resource://startpages/chrome.js", {});
} catch (e) { Cu.reportError(e); }
