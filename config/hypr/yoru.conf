# yoru on Hyprland before 0.56 (hyprland.conf). install.sh links this beside your
# config; add one line at the end of ~/.config/hypr/hyprland.conf:
#   source = ~/.config/hypr/yoru.conf
# Unbind any of your own binds on these keys first (Hyprland runs every bind on a
# key: the stock SUPER+M would quit Hyprland as the player opens).

# the wallpaper's colours, rewritten by `yoru` on every wallpaper change
source = ~/.config/hypr/yoru-colors.conf

exec-once = systemctl --user import-environment WAYLAND_DISPLAY DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE
exec-once = yoru restore
exec-once = yoru-shell
exec-once = wl-paste --watch cliphist store
exec-once = yoru-idle

# the shell draws the wallpaper and the logo would only peek through
misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}

windowrule = match:title ^yoru.*settings$, float on, size 1100 740, center on

# the island and the rest of the shell
bind = SUPER, A, exec, qs -c yoru ipc call island toggle launcher
bind = SUPER, V, exec, qs -c yoru ipc call island toggle clip
bind = SUPER, X, exec, qs -c yoru ipc call island toggle control
bind = SUPER, M, exec, qs -c yoru ipc call island toggle media
bind = SUPER, W, exec, qs -c yoru ipc call island toggle walls
bind = SUPER, Y, exec, qs -c yoru ipc call phone toggle
bind = SUPER, Tab, exec, qs -c yoru ipc call island toggle windows
bind = SUPER, slash, exec, qs -c yoru ipc call island toggle keys
bind = SUPER SHIFT, E, exec, qs -c yoru ipc call island toggle power
bind = SUPER SHIFT, W, exec, yoru wall next
bind = SUPER, I, exec, qs -n -p ~/.config/quickshell/yoru/settings.qml
bind = SUPER, E, exec, qs -c yoru ipc call desktop toggle
bind = SUPER, P, exec, qs -c yoru ipc call focus toggle
bind = SUPER, escape, exec, yoru-lock

# capture
bind = , Print, exec, yoru-shot full
bind = SUPER, Print, exec, yoru-shot area
bind = SUPER SHIFT, Print, exec, qs -c yoru ipc call record toggle
bind = SUPER CTRL, Print, exec, qs -c yoru ipc call record area
bind = SUPER SHIFT, C, exec, qs -c yoru ipc call picker pick

# media keys, with the island's OSD
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle && qs -c yoru ipc call osd mic
bindel = , XF86MonBrightnessUp, exec, brightnessctl -q set 5%+ && qs -c yoru ipc call osd brightness
bindel = , XF86MonBrightnessDown, exec, brightnessctl -q set 5%- && qs -c yoru ipc call osd brightness
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
