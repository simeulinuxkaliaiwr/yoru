# yoru's visualizer: cava writing bar heights for the desktop to draw.
# sleep_timer stays 0: when cava sleeps it stops writing, and the bars froze
[general]
bars = 64
framerate = 30
autosens = 1
sensitivity = 100
sleep_timer = 0
lower_cutoff_freq = 50
higher_cutoff_freq = 12000

[input]
method = pulse
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 1000
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
noise_reduction = 77
monstercat = 0
