# yoru's visualizer: cava writing bar heights for the desktop to draw
[general]
bars = 56
framerate = 45
autosens = 1
sleep_timer = 2

[input]
method = pulse
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 1000
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
noise_reduction = 70
monstercat = 1
