# yoru: out ~/.config/yazi/flavors/yoru.yazi/flavor.toml
# yoru: needs yazi
# generated by yoru from the wallpaper; theme.toml takes it with [flavor] dark = "yoru" (yazi reads it as it starts)
[mgr]
cwd = { fg = "#{{primary}}", bold = true }
find_keyword = { fg = "#{{tertiary}}", bold = true, italic = true, underline = true }
find_position = { fg = "#{{tertiary}}", bold = true, italic = true }
marker_copied = { fg = "#{{color2}}", bg = "#{{color2}}" }
marker_cut = { fg = "#{{error}}", bg = "#{{error}}" }
marker_marked = { fg = "#{{tertiary}}", bg = "#{{tertiary}}" }
marker_selected = { fg = "#{{primary}}", bg = "#{{primary}}" }
count_copied = { fg = "#{{on_primary}}", bg = "#{{color2}}" }
count_cut = { fg = "#{{on_error}}", bg = "#{{error}}" }
count_selected = { fg = "#{{on_primary}}", bg = "#{{primary}}" }
border_style = { fg = "#{{outline_variant}}" }

[status]
overall = { fg = "#{{on_surface_variant}}" }
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }
progress_label = { bold = true }
progress_normal = { fg = "#{{primary}}", bg = "#{{surface_container_high}}" }
progress_error = { fg = "#{{error}}", bg = "#{{surface_container_high}}" }
perm_type = { fg = "#{{primary}}" }
perm_read = { fg = "#{{color3}}" }
perm_write = { fg = "#{{error}}" }
perm_exec = { fg = "#{{color2}}" }
perm_sep = { fg = "#{{outline}}" }

[mode]
normal_main = { bg = "#{{primary}}", fg = "#{{on_primary}}", bold = true }
normal_alt = { bg = "#{{surface_container_high}}", fg = "#{{on_surface}}" }
select_main = { bg = "#{{tertiary}}", fg = "#{{on_tertiary}}", bold = true }
select_alt = { bg = "#{{surface_container_high}}", fg = "#{{on_surface}}" }
unset_main = { bg = "#{{error}}", fg = "#{{on_error}}", bold = true }
unset_alt = { bg = "#{{surface_container_high}}", fg = "#{{on_surface}}" }

[input]
border = { fg = "#{{primary}}" }
title = {}
value = { fg = "#{{on_surface}}" }
selected = { reversed = true }

[tabs]
active = { fg = "#{{on_primary}}", bg = "#{{primary}}", bold = true }
inactive = { fg = "#{{on_surface_variant}}", bg = "#{{surface_container}}" }
sep_inner = { open = "", close = "" }

[cmp]
border = { fg = "#{{primary}}", bg = "#{{surface_container_low}}" }

[tasks]
border = { fg = "#{{primary}}" }
title = {}
hovered = { fg = "#{{tertiary}}", underline = true }

[which]
cols = 3
mask = { bg = "#{{surface_container_low}}" }
cand = { fg = "#{{primary}}" }
rest = { fg = "#{{outline}}" }
desc = { fg = "#{{on_surface}}" }
separator = " ▶ "
separator_style = { fg = "#{{outline}}" }

[spot]
border = { fg = "#{{primary}}" }
title = { fg = "#{{primary}}" }
tbl_col = { fg = "#{{on_surface}}" }
tbl_cell = { fg = "#{{on_surface}}", bg = "#{{surface_container}}" }

[help]
on = { fg = "#{{primary}}" }
run = { fg = "#{{on_surface}}" }
hovered = { reversed = true, bold = true }
footer = { fg = "#{{on_primary}}", bg = "#{{primary}}" }

[notify]
title_info = { fg = "#{{primary}}" }
title_warn = { fg = "#{{color3}}" }
title_error = { fg = "#{{error}}" }

[filetype]
rules = [
    { mime = "image/*", fg = "#{{tertiary}}" },
    { mime = "{audio,video}/*", fg = "#{{color5}}" },
    { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#{{color3}}" },
    { mime = "application/{pdf,doc,rtf}", fg = "#{{color6}}" },
    { mime = "*", is = "orphan", fg = "#{{on_error_container}}", bg = "#{{error_container}}" },
    { mime = "application/*exec*", fg = "#{{color2}}" },
    { url = "*", fg = "#{{on_surface}}" },
    { url = "*/", fg = "#{{primary}}" },
]
