# yoru: out ~/.config/alacritty/themes/yoru.toml
# yoru: needs alacritty
# generated by yoru from the wallpaper; alacritty.toml takes it in [general]'s import list
# (alacritty follows the file by itself)
[colors.primary]
foreground = "#{{on_surface}}"
background = "#{{surface_container_lowest}}"

[colors.cursor]
text = "#{{on_primary}}"
cursor = "#{{primary}}"

[colors.selection]
text = "#{{on_primary_container}}"
background = "#{{primary_container}}"

[colors.search.matches]
foreground = "#{{on_tertiary_container}}"
background = "#{{tertiary_container}}"

[colors.hints.start]
foreground = "#{{on_primary}}"
background = "#{{primary}}"

[colors.normal]
black = "#{{color0}}"
red = "#{{color1}}"
green = "#{{color2}}"
yellow = "#{{color3}}"
blue = "#{{color4}}"
magenta = "#{{color5}}"
cyan = "#{{color6}}"
white = "#{{color7}}"

[colors.bright]
black = "#{{color8}}"
red = "#{{color9}}"
green = "#{{color10}}"
yellow = "#{{color11}}"
blue = "#{{color12}}"
magenta = "#{{color13}}"
cyan = "#{{color14}}"
white = "#{{color15}}"
