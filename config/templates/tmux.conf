# yoru: out ~/.config/tmux/yoru.conf
# yoru: needs tmux
# yoru: then tmux source-file ~/.config/tmux/yoru.conf 2>/dev/null
# generated by yoru from the wallpaper; tmux.conf takes it with: source-file ~/.config/tmux/yoru.conf
set -g status-style "bg=#{{surface_container_low}},fg=#{{on_surface_variant}}"
set -g status-left-style "fg=#{{primary}},bold"
set -g status-right-style "fg=#{{on_surface_variant}}"
set -g window-status-style "fg=#{{on_surface_variant}}"
set -g window-status-current-style "bg=#{{primary}},fg=#{{on_primary}},bold"
set -g window-status-activity-style "fg=#{{tertiary}}"
set -g pane-border-style "fg=#{{outline_variant}}"
set -g pane-active-border-style "fg=#{{primary}}"
set -g message-style "bg=#{{surface_container_high}},fg=#{{on_surface}}"
set -g message-command-style "bg=#{{surface_container_high}},fg=#{{primary}}"
set -g mode-style "bg=#{{primary_container}},fg=#{{on_primary_container}}"
set -g popup-border-style "fg=#{{primary}}"
set -g display-panes-active-colour "#{{primary}}"
set -g display-panes-colour "#{{outline}}"
set -g clock-mode-colour "#{{primary}}"
