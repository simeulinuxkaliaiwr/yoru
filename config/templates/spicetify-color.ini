; yoru: out ~/.config/spicetify/Themes/yoru/color.ini
; yoru: needs spicetify
; yoru: then spicetify -q refresh
; generated by yoru from the wallpaper; `spicetify config current_theme yoru color_scheme yoru` and `spicetify apply` once
[yoru]
text               = {{on_surface}}
subtext            = {{on_surface_variant}}
main               = {{surface}}
main-elevated      = {{surface_container}}
highlight          = {{surface_container_high}}
highlight-elevated = {{surface_container_highest}}
sidebar            = {{surface_container_low}}
player             = {{surface_container}}
card               = {{surface_container}}
shadow             = 000000
selected-row       = {{on_surface_variant}}
button             = {{primary}}
button-active      = {{primary}}
button-disabled    = {{outline}}
tab-active         = {{surface_container_high}}
notification       = {{primary_container}}
notification-error = {{error}}
misc               = {{tertiary}}
